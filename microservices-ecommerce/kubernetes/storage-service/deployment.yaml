apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service

  template:
    metadata:
      labels:
        app: storage-service

    spec:
      containers:
        - name: storage-service
          image: ecommerce/storage-service:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: PORT

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD