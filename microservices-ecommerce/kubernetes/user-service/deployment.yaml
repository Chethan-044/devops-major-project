apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: ecommerce/user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001

          env:
            - name: PORT
              value: "8001"

            - name: STORAGE_SERVICE_URL
              value: "http://storage-service:8004"
